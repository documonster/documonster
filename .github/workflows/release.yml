name: Release

on:
  push:
    branches:
      - main

# Publishing uses npm trusted publishing (OIDC). pnpm exchanges the id token
# `id-token: write` grants for a short-lived one and enables provenance by
# itself, so no `NODE_AUTH_TOKEN` and no `--provenance` below. npm matches the
# trusted publisher by workflow filename, per package: both `documonster` and
# `@documonster/mcp` must point at `release.yml`.
permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  # Merging the release PR is what creates the GitHub release + tag and sets
  # release_created=true — the signal both publish jobs and the canary gate on.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Skipped on a release commit: that push is the merged release PR, whose real
  # version the publish job below ships instead.
  canary:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          CI: true

      - name: Generate canary version
        id: canary_version
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          CANARY_VERSION="${CURRENT_VERSION}-canary.sha.${COMMIT_SHORT}"
          echo "version=${CANARY_VERSION}" >> $GITHUB_OUTPUT
          CANARY_VERSION="${CANARY_VERSION}" node - <<'NODE'
          const fs = require("node:fs");
          for (const file of ["package.json", "packages/mcp/package.json"]) {
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.CANARY_VERSION;
            fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE

      - name: Publish documonster canary
        run: |
          VERSION="${{ steps.canary_version.outputs.version }}"
          if node scripts/verify-published.ts --exists "documonster@${VERSION}"; then
            echo "documonster@${VERSION} is already published — skipping"
          else
            pnpm publish --tag canary --no-git-checks
          fi

      - name: Build @documonster/mcp canary
        run: pnpm build:packages

      - name: Publish @documonster/mcp canary
        working-directory: packages/mcp
        run: |
          VERSION="${{ steps.canary_version.outputs.version }}"
          if node ../../scripts/verify-published.ts --exists "@documonster/mcp@${VERSION}"; then
            echo "@documonster/mcp@${VERSION} is already published — skipping"
          else
            # `--access public` must be explicit: pnpm does not apply the
            # package's `publishConfig.access`, and a scoped package defaults to
            # restricted, which publishes "successfully" but is invisible to
            # everyone but the owner.
            pnpm publish --tag canary --access public --no-git-checks
          fi

      # Deliberately unauthenticated: an anonymous read is the only thing that
      # proves the packages are actually installable by a user, and an
      # authenticated read succeeds for a restricted package.
      #
      # This used to be `sleep 30` plus a single `npm view`, which could not
      # work: `npm view pkg@version` reads the packument, and that document is
      # CDN-cached for 300 seconds. See scripts/verify-published.ts.
      - name: Verify canary publishes
        run: |
          node scripts/verify-published.ts \
            "documonster@${{ steps.canary_version.outputs.version }}" \
            "@documonster/mcp@${{ steps.canary_version.outputs.version }}"

      - name: Comment on commit
        uses: actions/github-script@v9
        with:
          script: |
            // The publish above already succeeded and was verified against the
            // registry, so this notification must not be able to fail the job.
            // `createCommitComment` returns a promise: without `await` a rejected
            // request surfaces as an unhandled rejection and fails the run, and a
            // transient 500 from the GitHub API is enough to trigger it.
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `🚀 Canary version published: \`${{ steps.canary_version.outputs.version }}\`\n\nInstall core: \`npm install documonster@canary\`\n\nInstall MCP: \`npm install @documonster/mcp@canary\``
              });
            } catch (error) {
              core.warning(`Canary published, but commenting on the commit failed: ${error.message}`);
            }

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Idempotent: a re-run after a partial release (core published, MCP
          # failed) must not abort on "version already exists".
          if node scripts/verify-published.ts --exists "documonster@${VERSION}"; then
            echo "documonster@${VERSION} is already published — skipping"
            exit 0
          fi
          if echo "$VERSION" | grep -q "beta\|alpha\|rc"; then
            echo "Publishing ${VERSION} with --tag beta"
            pnpm publish --tag beta --no-git-checks
          else
            echo "Publishing ${VERSION} as latest"
            pnpm publish --no-git-checks
          fi

      # Unauthenticated and polled — see scripts/verify-published.ts for why a
      # single `npm view` after a fixed sleep reports a false failure.
      - name: Verify publish
        run: |
          node scripts/verify-published.ts "documonster@$(node -p "require('./package.json').version")"

  # Ordering matters. `@documonster/mcp` depends on `documonster: workspace:*`,
  # which `pnpm publish` rewrites to the core version present in this checkout.
  # The core must therefore reach npm first, or the published MCP package would
  # point at a version that does not exist yet — hence `needs: publish`.
  publish-mcp:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      # The MCP package resolves `documonster` through its published exports
      # map, so the core's ESM + type output must exist before it can compile.
      - name: Build core (ESM + types)
        run: pnpm build:esm

      - name: Build @documonster/mcp
        run: pnpm build:packages

      - name: Publish @documonster/mcp to npm
        working-directory: packages/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if node ../../scripts/verify-published.ts --exists "@documonster/mcp@${VERSION}"; then
            echo "@documonster/mcp@${VERSION} is already published — skipping"
            exit 0
          fi
          if echo "$VERSION" | grep -q "beta\|alpha\|rc"; then
            echo "Publishing @documonster/mcp@${VERSION} with --tag beta"
            pnpm publish --tag beta --access public --no-git-checks
          else
            echo "Publishing @documonster/mcp@${VERSION} as latest"
            pnpm publish --access public --no-git-checks
          fi

      # Unauthenticated on purpose — see the canary job's verify step.
      #
      # `working-directory` stays on the package so the version is read from its
      # own manifest, but the script lives at the repository root.
      - name: Verify publish
        working-directory: packages/mcp
        run: |
          node ../../scripts/verify-published.ts "@documonster/mcp@$(node -p "require('./package.json').version")"
