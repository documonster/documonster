# Workspace members. The repository root is itself the `documonster` package
# (pnpm always treats the root as a workspace package); `packages/*` holds the
# satellite packages that are allowed to carry runtime dependencies, which the
# zero-dependency core never may.
packages:
  - "packages/*"

# Versions shared by the root package and the satellites. A satellite is a real
# consumer of the public API (see AGENTS.md), but it is not a separate project: it
# type-checks with the same tsc and runs on the same vitest, and a satellite left a
# major behind put two copies of vitest in the tree. Declaring them once means a
# renovate bump lands on both at the same time instead of drifting.
catalog:
  "@types/node": ^26.6.0
  rimraf: ^6.1.3
  typescript: 7.0.2
  vitest: ^5.0.1

# `@oxc-node/core`'s own `register.mjs` calls the deprecated `module.register()`,
# which runs the hooks on a worker thread and emits DEP0205 on Node >= 25.9 — on
# every `node --import @oxc-node/core/register`, which is every gate script here.
# The patch uses the synchronous in-thread `module.registerHooks()` on Node >= 26.2
# and keeps `register()` below that, because `registerHooks` only became a complete
# replacement in 26.2.0 (nodejs/node#59011 and nodejs/node#62920).
#
# Upstream has never made this change: `register.mjs` is byte-identical from 0.1.0
# to 0.1.2 and on `main`, so bumping the version does not remove the need for the
# patch — verify against the installed file before assuming a release fixed it.
# Submitted as https://github.com/oxc-project/oxc-node/pull/764; drop the patch
# once a release contains it.
patchedDependencies:
  "@oxc-node/core@0.1.2": patches/@oxc-node__core@0.1.2.patch

# esbuild's postinstall only copies the platform binary into its own `bin/`, which
# saves a Node.js startup for the *CLI*. Nothing here uses that CLI — `scripts/
# treeshake-verify.ts` calls the JS API, which spawns the binary out of
# `@esbuild/<platform>` directly — so the script buys nothing and is declined.
# Verified: `buildSync` works and `pnpm verify:treeshake` passes 111/111.
allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - "@types/node@26.6.0"
  - "@vitest/browser-playwright@5.0.1"
  - "@vitest/browser@5.0.1"
  - "@vitest/mocker@5.0.1"
  - "@vitest/pretty-format@5.0.1"
  - "@vitest/spy@5.0.1"
  - "@vitest/ui@5.0.1"
  - "@vitest/utils@5.0.1"
  - vitest@5.0.1
